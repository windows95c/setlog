<style>
/* Layout: single column, sticky slate bar, cards per data block; gaffer-amber accent on monitor-grey neutrals */
:root{
  --bg:#eceef0; --bar:#f7f8f9; --surface:#ffffff; --surface2:#e6e9ec; --fg:#14171a; --muted:#5b646e;
  --line:#d2d7dc; --accent:#a86a00; --accent-fg:#ffffff; --ok:#16804a; --warn:#b3261e; --rec:#d93025;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0e1012;--bar:#14171a;--surface:#181b1f;--surface2:#23272c;--fg:#e9ecef;--muted:#8f97a0;
  --line:#2c3137;--accent:#f0b23a;--accent-fg:#151515;--ok:#3ccb7f;--warn:#ff6b5e;--rec:#ff5a4f;color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;background:var(--bar);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));min-height:54px}
#backBtn{width:44px;height:44px;border:none;background:transparent;color:var(--accent);font-size:30px;line-height:1;cursor:pointer}
.ttl{flex:1;min-width:0}
#ttl{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#saveDot{font-size:11px;color:var(--muted);padding:0 6px;white-space:nowrap}
#saveDot.busy{color:var(--accent)} #saveDot.err{color:var(--warn)}
main{max-width:720px;margin:0 auto;padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:8px}
.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:650}
.sec-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.span2{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted)}
input,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface2);border:1px solid transparent;border-radius:8px;padding:10px 11px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
input[type=date],input[type=time]{min-height:44px}
textarea{resize:vertical}
.mono-in input{font-family:var(--mono);font-weight:700;letter-spacing:.03em}
.btn{font:inherit;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:center;position:relative}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.chip:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost-danger{color:var(--warn);background:transparent}
.armed{background:var(--warn)!important;color:#fff!important;border-color:var(--warn)!important}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns>.btn{flex:1 1 140px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:62px;cursor:pointer}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main strong{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{color:var(--muted);font-size:12px;white-space:nowrap;text-align:right}
.badge{display:inline-block;background:var(--fg);color:var(--bg);border-radius:6px;padding:3px 7px;font-size:13px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.take{display:grid;grid-template-columns:52px 1fr 40px 40px;gap:6px 8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.take:last-of-type{border-bottom:none}
.take .note{grid-column:2/5}
.x.mic{font-size:18px}
.x.mic.rec{width:auto;padding:0 8px;font-size:13px;border-radius:8px}
.memo .tk{color:var(--accent);font-weight:600}
.tnum{width:52px;height:44px;border-radius:22px;border:2px solid var(--line);background:transparent;color:var(--fg);font-size:17px;font-weight:700;cursor:pointer}
.take.circ .tnum{border-color:var(--ok);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.x{width:40px;height:40px;border-radius:20px;border:none;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;flex:none}
.x.armed{width:auto;padding:0 10px;font-size:13px;border-radius:8px}
.cam-h{display:flex;align-items:center;gap:8px;margin:0;font-size:15px}
.ph-wrap{display:flex;flex-direction:column;gap:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:4px}
.th{position:relative;padding:0;border:none;background:var(--surface2);border-radius:6px;overflow:hidden;aspect-ratio:4/3;cursor:pointer;-webkit-tap-highlight-color:transparent}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th-mm{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.6);color:#f0b23a;font-size:10px;padding:1px 4px;border-radius:4px}
.th-ed{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:0 4px;border-radius:4px}
.th.sel{outline:3px solid var(--accent);outline-offset:-3px}
.th.sel::after{content:"✓";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-fg);font-size:14px;line-height:22px;text-align:center;font-weight:700}
.ph-h{margin:4px 0 0;font-size:13px;font-weight:650;display:flex;gap:6px;align-items:baseline}
.ph-h .mono{color:var(--muted);font-weight:400}
.chips.small .chip{min-height:34px;font-size:13px;padding:0 10px}
.selbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.actbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--bar);border-top:1px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.ab{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.ab span{font-size:12px;font-weight:600}
.ab.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.ab.rec{background:var(--rec);color:#fff;border-color:var(--rec);font-size:14px;font-weight:700}
.actbar-space{height:84px}
#ls{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.ls-in{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ls-grid select,#le select{font:inherit;font-size:15px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:0 8px;width:100%;min-width:0}
#le select{background:#1d2024;color:#eee;border-color:#333;width:auto;flex:none;max-width:60vw}
.chip.own{border-color:var(--accent)}
.ls-shoot{min-height:56px;font-size:17px}
#le{position:fixed;inset:0;z-index:80;background:#000;color:#eee;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#leC{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
@media (orientation:landscape) and (max-height:500px){#le{display:grid;grid-template-columns:1fr 230px;grid-template-rows:auto 1fr}#le .ed-top{grid-column:1/3}#le .ed-stage{grid-column:1}#le .ed-bar{grid-column:2;overflow-y:auto}#le .ed-row{flex-wrap:wrap;overflow:visible}}
.scn{display:grid;grid-template-columns:72px 1fr 40px;gap:6px;align-items:center}
details.card>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";color:var(--muted)}
details.card[open]>summary::after{content:"▴"}
.memo{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.memo:last-of-type{border-bottom:none}
.memo-h{display:flex;align-items:center;gap:8px}
.memo-h .t{font-size:13px;color:var(--muted);flex:1}
.memo.done .t::after{content:" · übernommen";color:var(--ok)}
.memo audio{width:100%;height:36px}
.rec{background:var(--rec)!important;color:#fff!important;border-color:var(--rec)!important}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);text-align:center;font-size:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.warn{color:var(--warn)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;min-height:40px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
details summary{cursor:pointer;padding:6px 0}
.danger{display:flex;justify-content:center}
.install{border-color:var(--accent)}
pre.box{margin:0;max-height:220px;overflow:auto;background:var(--surface2);border-radius:8px;padding:10px;font:12px/1.4 var(--mono);white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center}
#sheet,#viewer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet{z-index:90}
.sheet-in{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
#viewer{background:#000;flex-direction:column;align-items:stretch;justify-content:flex-start;z-index:70;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.vw-top{flex:none;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;color:#eee;font-size:14px}
#vwCount{flex:none;color:#f0b23a}
#vwCap{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#bbb}
.vw-x{flex:none;width:44px;height:44px;border-radius:22px;border:1px solid #333;background:#1d2024;color:#eee;font-size:18px;cursor:pointer}
#vwTrack{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain}
#vwTrack::-webkit-scrollbar{display:none}
.vw-bot{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;background:#111;border-top:1px solid #2a2a2a}
.vw-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.vw-chips::-webkit-scrollbar{display:none}
.vw-chips .chip{flex:none;background:#1d2024;color:#ddd;border-color:#333}
.vw-chips .chip[aria-pressed="true"]{background:#f0b23a;color:#111;border-color:#f0b23a}
.vw-row{display:flex;gap:8px}
.vw-draw{flex:none;font:inherit;font-size:14px;font-weight:600;border-radius:8px;border:1px solid #f0b23a;background:transparent;color:#f0b23a;padding:0 12px;min-height:42px;cursor:pointer}
#ed{position:fixed;inset:0;z-index:80;background:#000;color:#eee;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ed-top{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px}
.ed-top .t{flex:1;text-align:center;font-weight:600}
.ed-btn{font:inherit;font-size:15px;font-weight:600;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid #333;background:#1d2024;color:#eee;cursor:pointer}
.ed-btn.pri{background:#f0b23a;color:#111;border-color:#f0b23a}
.ed-stage{position:relative;flex:1;min-height:0}
#edC{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ed-bar{flex:none;display:flex;flex-direction:column;gap:6px;padding:6px 8px 8px;background:#111;border-top:1px solid #2a2a2a}
.ed-row{display:flex;gap:6px;overflow-x:auto;align-items:center;scrollbar-width:none}
.ed-row::-webkit-scrollbar{display:none}
.ed-tool{flex:none;min-width:48px;height:44px;border-radius:10px;border:1px solid #333;background:#1d2024;color:#eee;font-size:18px;cursor:pointer;padding:0 8px}
.ed-tool small{font-size:11px;display:block;line-height:1}
.ed-tool[aria-pressed="true"]{background:#f0b23a;color:#111;border-color:#f0b23a}
.ed-col{flex:none;width:34px;height:34px;border-radius:17px;border:2px solid #444;cursor:pointer}
.ed-col[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #f0b23a}
.ed-sep{flex:none;width:1px;height:28px;background:#333}
.ed-hint{font-size:12px;color:#aaa;padding:0 4px}
@media (orientation:landscape) and (max-height:500px){#ed{display:grid;grid-template-columns:1fr 210px;grid-template-rows:auto 1fr}.ed-top{grid-column:1/3}.ed-stage{grid-column:1}.ed-bar{grid-column:2;overflow-y:auto;border-top:none;border-left:1px solid #2a2a2a}.ed-row{flex-wrap:wrap;overflow:visible}}
.vw-bot input{background:#1d2024;color:#eee;border:1px solid #333;font-size:16px;border-radius:8px;padding:9px 10px;width:100%}
.vw-slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center}
.vw-slide img{max-width:100%;max-height:100%;object-fit:contain;display:block}
/* Report: deliberately paper-white in both themes */
.toolbar{display:flex;flex-direction:column;gap:8px}
.report{background:#fff;color:#111;border-radius:8px;padding:20px 18px;font-size:13px;line-height:1.4}
.report h1{font-size:22px;margin:2px 0 10px;text-wrap:balance}
.report h2{font-size:16px;margin:0;padding:8px 0 2px;border-bottom:2px solid #111}
.r-kicker{font-size:11px;letter-spacing:.14em;color:#555}
.r-meta{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:0}
.r-meta dt{color:#555}.r-meta dd{margin:0}
.r-day{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.r-sub{margin:0;color:#444}
.r-setup{border:1px solid #bbb;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:6px;break-inside:avoid;page-break-inside:avoid}
.r-sh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.r-id{font-size:17px;font-weight:800}
.r-setup p{margin:0}
.r-tags{color:#7a4d00;font-weight:600}
.tbl{overflow-x:auto}
.report table{border-collapse:collapse;width:100%;font-size:11.5px}
.report th,.report td{border:1px solid #ccc;padding:3px 5px;text-align:left;vertical-align:top}
.report th{background:#f0f0f0;font-weight:650;white-space:nowrap}
.r-refs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px}

.r-photos figcaption{font-size:10.5px;color:#444}
.r-memo{font-size:12px;color:#333;border-left:3px solid #ccc;padding-left:8px}
.r-foot{margin-top:16px;color:#777;font-size:10.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
a.btn{text-decoration:none}

  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

.vf-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.vf-thumb{cursor:pointer;width:48px;height:48px;border-radius:8px;background:#1d2024 center/cover no-repeat;border:1px solid #333}
.vf-count{font-size:12px;color:#aaa}
.vf-side{justify-self:end;display:flex;flex-direction:column;align-items:center;gap:4px}
.vf-hq{display:flex;align-items:center;justify-content:center;width:52px;height:40px;border-radius:10px;border:1px solid #f0b23a;color:#f0b23a;font-weight:700;font-size:14px;cursor:pointer}
.vf-shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:#f0b23a;cursor:pointer}
.vf-shutter:active{transform:scale(.94)}
.vf-set{position:absolute;left:0;right:0;bottom:0;background:#16191c;color:#eee;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:80%;overflow:auto;z-index:2}
.vf-set input,.vf-set select{background:#23272c;color:#eee;font:inherit;font-size:16px;border-radius:8px;border:1px solid #333;padding:10px;min-height:44px}
.vf-set .hint{color:#9aa}
.vf-set .btn{background:#23272c;color:#eee;border-color:#333}.vf-set .btn.primary{background:#f0b23a;color:#111;border-color:#f0b23a}
@media (orientation:landscape) and (max-height:500px){
  #vf{display:grid;grid-template-columns:1fr 150px;grid-template-rows:auto 1fr}
  .vf-top{grid-column:1/3}
  .vf-stage{grid-row:2;grid-column:1}
  .vf-bot{grid-row:2;grid-column:2;flex-direction:row;padding:0 6px 6px 0;gap:6px;min-height:0}
  .vf-focals{flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:0;width:56px}
  .vf-row{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:0;flex:1}
  .vf-count{justify-self:auto}.vf-side{justify-self:auto}
}
@media print{
  @page{margin:12mm}
  body{background:#fff;padding:0}
  #bar,.noprint,#toast{display:none!important}
  main{max-width:none;padding:0}
  .report{padding:0;border-radius:0}
  .tbl{overflow:visible}
}
@media (prefers-reduced-motion: reduce){.btn:active{transform:none}}
</style>
</head>
<body>
<header id="bar">
  <button id="backBtn" aria-label="Zurück" hidden>‹</button>
  <div class="ttl"><div id="ttl">VFX Setlog</div><div id="sub" class="mono"></div></div>
  <span id="saveDot" class="mono">gespeichert</span>
</header>
<main id="app"></main>
<div id="toast" role="status" hidden></div>
<div id="sheet" hidden><div class="sheet-in"><p id="sheetMsg" class="hint"></p><button class="btn primary block" id="sheetGo">Teilen …</button><p class="hint">Im Teilen-Menü: <b>In Dateien sichern</b> – oder direkt an die Claude-App senden.</p><button class="btn block" id="sheetX">Schließen</button></div></div>
<div id="viewer" hidden role="dialog" aria-label="Fotos"><div class="vw-top"><span id="vwCount" class="mono"></span><span id="vwCap"></span><button id="vwClose" class="vw-x" aria-label="Schließen">✕</button></div><div id="vwTrack"></div><div id="vwBot" class="vw-bot" hidden></div></div>
<script>
window.__fatal=function(m){try{var a=document.getElementById('app');if(!a)return;var d=document.createElement('div');d.className='empty';d.style.textAlign='left';d.style.color='var(--warn)';d.textContent='Fehler: '+m;a.appendChild(d);var s=document.getElementById('sub');if(s)s.textContent='Startfehler – Screenshot an Claude';}catch(e){}};
window.addEventListener('error',function(e){window.__fatal((e.message||'Unbekannt')+(e.lineno?' (Zeile '+e.lineno+')':''));});
window.addEventListener('unhandledrejection',function(e){var r=e.reason;window.__fatal(r&&r.message?r.message:String(r));});
</script>
<script>
'use strict';
const APP_VERSION='1.6.1';
/* Kamera/Mikro offen halten: iOS fragt bei jedem neuen Zugriff erneut – Streams werden daher wiederverwendet und erst nach Leerlauf freigegeben */
const KEEP_MS=3*60000;const media={cam:null,camKey:'',camT:0,mic:null,micT:0};
const liveStream=s=>!!(s&&s.getTracks().some(t=>t.readyState==='live'&&!t.muted&&t.enabled));
// Nach Nutzung der nativen iPhone-Kamera ist ein geparkter Stream oft tot → dann neu anfordern
document.addEventListener('click',e=>{const l=e.target.closest('label');if(l&&l.querySelector('input[capture]')){media.nativeUsed=Date.now();}},true);
async function getCam(video,force){clearTimeout(media.camT);const key=JSON.stringify(video);
  if(!force&&liveStream(media.cam)&&media.camKey===key&&!(media.nativeUsed>(media.camAt||0)))return media.cam;releaseCam();
  media.cam=await navigator.mediaDevices.getUserMedia({audio:false,video});media.camKey=key;media.camAt=Date.now();return media.cam;}
function releaseCam(){clearTimeout(media.camT);if(media.cam)media.cam.getTracks().forEach(t=>t.stop());media.cam=null;}
function parkCam(){clearTimeout(media.camT);media.camT=setTimeout(releaseCam,KEEP_MS);}
async function getMic(){clearTimeout(media.micT);if(liveStream(media.mic))return media.mic;media.mic=await navigator.mediaDevices.getUserMedia({audio:true});return media.mic;}
function releaseMic(){clearTimeout(media.micT);if(media.mic)media.mic.getTracks().forEach(t=>t.stop());media.mic=null;}
function parkMic(){clearTimeout(media.micT);media.micT=setTimeout(releaseMic,KEEP_MS);}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!(typeof vf!=='undefined'&&vf.on)&&!(typeof rec!=='undefined'&&rec)){releaseCam();releaseMic();}});
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=v=>esc(v).replace(/\n/g,'<br>');
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad2=v=>String(v??'').padStart(2,'0');
const today=()=>new Date().toLocaleDateString('sv-SE');
const nowHM=()=>new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const fmtDate=d=>{if(!d)return 'Ohne Datum';const x=new Date(d+'T12:00');return isNaN(x)?d:x.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});};
const fmtDT=ts=>new Date(ts).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const slug=s=>String(s||'projekt').normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^\w-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40)||'projekt';
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);

const REFS=[{k:'clean',l:'Clean Plate'},{k:'grid',l:'Lens Grid'},{k:'chart',l:'Farbkarte'},{k:'balls',l:'Grey/Chrome Ball'},{k:'hdri',l:'HDRI'},{k:'witness',l:'Witness Cam'},{k:'markers',l:'Tracking Marker'},{k:'measure',l:'Maße'},{k:'stills',l:'Set-Fotos'},{k:'scan',l:'LiDAR/Scan'},{k:'element',l:'Element/Pass'},{k:'bgplate',l:'BG Plate'}];
const KINDS=['Cleanup','Set Extension','Sky Replacement','Screen Insert','Green/Blue Screen','CG Integration','Beauty/Retusche','Split Screen','Retime','Crowd','Compositing'];
const WEATHER=['Sonne','Bewölkt','Wechselnd','Regen','Dämmerung','Nacht','Studio'];
const CAM_FIELDS=['cam','body','lens','mm','tstop','iso','shutter','fps','filter','kelvin','height','tilt','focus','rig','note'];
const DL={fps:['23.976','24','25','29.97','48','50','100'],shutter:['180°','172.8°','90°','45°','1/50','1/100'],iso:['400','800','1280','1600','3200'],k:['3200','4300','5600','6500'],filter:['–','ND 0.3','ND 0.6','ND 0.9','ND 1.2','Pol','Black Pro-Mist 1/8','Black Pro-Mist 1/4'],rig:['Stativ','Dolly','Slider','Handheld','Easyrig','Steadicam','Gimbal','Kran','Car Rig','Drohne']};

/* ---------- IndexedDB ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{let done=false;
  const tryOpen=()=>{let r;try{r=indexedDB.open('vfx-setlog',2);}catch(e){if(!done){done=true;rej(e);}return;}
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains('items'))d.createObjectStore('items',{keyPath:'id'});
      if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'}).createIndex('setup','setupId');
      if(!d.objectStoreNames.contains('audio'))d.createObjectStore('audio',{keyPath:'id'}).createIndex('setup','setupId');
      if(!d.objectStoreNames.contains('orig'))d.createObjectStore('orig',{keyPath:'id'}).createIndex('setup','setupId');};
    r.onsuccess=()=>{if(done){try{r.result.close()}catch{}return;}done=true;res(r.result);};
    r.onerror=()=>{if(!done){done=true;rej(r.error||new Error('IndexedDB-Fehler'));}};};
  if(!window.indexedDB){rej(new Error('IndexedDB nicht verfügbar'));return;}
  tryOpen();
  setTimeout(()=>{if(!done)tryOpen();},1200);   // iOS-Bug: erster open() hängt manchmal
  setTimeout(()=>{if(!done)tryOpen();},3000);
  setTimeout(()=>{if(!done){done=true;rej(new Error('Lokaler Speicher antwortet nicht (Timeout)'));}},8000);});}
function txn(stores,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(stores,mode);let out;try{out=fn(t);}catch(e){try{t.abort()}catch{}rej(e);return;}
  t.oncomplete=()=>res(out&&typeof out==='object'&&'readyState' in out?out.result:out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('Abgebrochen'));});}
const idb=(store,mode,op)=>txn(store,mode,t=>op(t.objectStore(store)));
const byCreated=(a,b)=>(a.created||0)-(b.created||0);
const getPhotos=async sid=>(await idb('photos','readonly',s=>s.index('setup').getAll(sid))).sort(byCreated);
const getAudio=sid=>idb('audio','readonly',s=>s.index('setup').getAll(sid));

const S=new Map();
const kids=(parent,type)=>{const l=[...S.values()].filter(i=>i.parent===parent&&i.type===type);
  if(type==='day')return l.sort((a,b)=>String(a.date).localeCompare(String(b.date))||(+a.dt||0)-(+b.dt||0)||byCreated(a,b));
  return l.sort(byCreated);};
const projectOf=it=>it.type==='project'?it:(it.type==='day'||it.type==='loc')?S.get(it.parent):S.get(S.get(it.parent)?.parent);
const setupsOf=it=>it.type==='setup'?[it]:it.type==='day'?kids(it.id,'setup'):kids(it.id,'day').flatMap(d=>kids(d.id,'setup'));

/* ---------- Save ---------- */
const pending=new Set();let saveT;
const dot=$('#saveDot');
function touch(it){it.updated=Date.now();pending.add(it.id);dot.className='mono busy';dot.textContent='speichert…';clearTimeout(saveT);saveT=setTimeout(flush,350);}
async function flush(){clearTimeout(saveT);const ids=[...pending];pending.clear();if(!ids.length)return;
  try{await idb('items','readwrite',s=>{ids.forEach(id=>{const it=S.get(id);if(it)s.put(it);});});dot.className='mono';dot.textContent='gespeichert';}
  catch(e){dot.className='mono err';dot.textContent='Fehler!';toast('Speichern fehlgeschlagen: '+(e&&e.message||e));}}
async function putNow(it){it.updated=Date.now();S.set(it.id,it);await idb('items','readwrite',s=>s.put(it));}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});
window.addEventListener('pagehide',flush);

function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){const k=ks[i];if(a[k]==null)a[k]=/^\d+$/.test(ks[i+1])?[]:{};a=a[k];}a[ks[ks.length-1]]=v;}

/* ---------- UI helpers ---------- */
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200);}
function F(label,k,val,o={}){const id='f_'+k.replace(/\W/g,'_');const lab=label?`<span>${esc(label)}</span>`:'';
  const common=`id="${id}" data-k="${esc(k)}" placeholder="${esc(o.ph||'')}" autocomplete="off" autocapitalize="${o.cap||'sentences'}"`;
  if(o.type==='textarea')return `<label class="fld ${o.cls||''}">${lab}<textarea ${common} rows="${o.rows||3}">${esc(val)}</textarea></label>`;
  return `<label class="fld ${o.cls||''}">${lab}<input ${common} type="${o.type||'text'}" value="${esc(val)}"${o.list?` list="${o.list}"`:''}${o.mode?` inputmode="${o.mode}"`:''}></label>`;}
const chip=(k,val,on)=>`<button type="button" class="chip" data-act="toggle" data-k="${esc(k)}" data-val="${esc(val)}" aria-pressed="${!!on}">${esc(val)}</button>`;
const empty=t=>`<div class="empty">${t}</div>`;
const opts=a=>a.map(v=>`<option value="${esc(v)}"></option>`).join('');
const datalists=p=>`<datalist id="dl-cam">${opts(lines(p.camPresets))}</datalist><datalist id="dl-lens">${opts(lines(p.lensPresets))}</datalist><datalist id="dl-fps">${opts(DL.fps)}</datalist><datalist id="dl-shutter">${opts(DL.shutter)}</datalist><datalist id="dl-iso">${opts(DL.iso)}</datalist><datalist id="dl-k">${opts(DL.k)}</datalist><datalist id="dl-filter">${opts(DL.filter)}</datalist><datalist id="dl-rig">${opts(DL.rig)}</datalist>`;

/* ---------- Navigation ---------- */
let nav=[{v:'home'}];
function go(v,id){flush();photoUI.sel=null;nav.push({v,id});render();window.scrollTo(0,0);}
function back(){flush();stopRec();photoUI.sel=null;if(nav.length>1){nav.pop();render();window.scrollTo(0,0);}}
$('#backBtn').addEventListener('click',back);
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y);}
let objURLs=[];
function render(){
  objURLs.forEach(u=>URL.revokeObjectURL(u));objURLs=[];
  let cur=nav[nav.length-1];
  if(cur.id&&!S.has(cur.id)){nav=[{v:'home'}];cur=nav[0];}
  const V={home:vHome,project:vProject,day:vDay,setup:vSetup,report:vReport,claude:vClaude,loc:vLoc}[cur.v]||vHome;
  const r=V(cur);
  $('#ttl').textContent=r.title;$('#sub').textContent=r.sub||'';
  $('#backBtn').hidden=nav.length<2;
  app.innerHTML=r.html;
  r.after&&r.after();
}

/* ---------- Views ---------- */
function vHome(){
  const ps=kids(null,'project').sort((a,b)=>(b.updated||0)-(a.updated||0));
  const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  return {title:'VFX Setlog',sub:'v'+APP_VERSION+' · lokal auf diesem Gerät',html:`
  ${standalone?'':`<section class="card install"><h2 class="sec">Offline nutzen</h2><p class="hint">In Safari auf <b>Teilen</b> → <b>Zum Home-Bildschirm</b>. Danach läuft die App offline, und die Daten werden nicht nach 7 Tagen von iOS gelöscht.</p></section>`}
  <section class="stack"><div class="sec-row"><h2 class="sec">Projekte</h2><span class="meta mono">${ps.length}</span></div>
  ${ps.map(p=>{const n=kids(p.id,'day').length,nl_=kids(p.id,'loc').length;return `<button class="row" data-act="open" data-v="project" data-id="${p.id}"><div class="row-main"><strong>${esc(p.name)}</strong><span class="meta">${esc([p.prodnr,p.client].filter(Boolean).join(' · ')||'—')}</span></div><span class="count mono">${n} DT${nl_?` · ${nl_} Loc`:''}</span></button>`}).join('')||empty('Noch kein Projekt. Leg eins an oder lade ein Backup.')}
  </section>
  <div class="btns"><button class="btn primary" data-act="newProject">+ Neues Projekt</button><label class="btn">Backup laden<input class="vh" type="file" accept="application/json,.json" data-file="import"></label></div>
  <p class="hint" id="storeInfo"></p>`,after:storeInfo};
}
async function storeInfo(){const el=$('#storeInfo');if(!el)return;const t=[];
  try{if(navigator.storage&&navigator.storage.persist){const ok=(await navigator.storage.persisted())||(await navigator.storage.persist());t.push(ok?'Speicher dauerhaft':'Speicher nicht als dauerhaft markiert – regelmäßig Backup sichern');}
  if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();t.push((e.usage/1e6).toFixed(1)+' MB belegt');}}catch{}
  el.textContent=t.join(' · ');}

function vProject(cur){
  const p=S.get(cur.id);const days=kids(p.id,'day');const nSet=setupsOf(p).length;
  const memoOpen=[...setupsOf(p),...locsOf(p)].reduce((n,s)=>n+(s.memos||[]).filter(m=>!m.done&&m.text.trim()).length,0);
  return {title:p.name,sub:[p.prodnr,p.client].filter(Boolean).join(' · '),html:`
  <section class="card" data-item="${p.id}"><h2 class="sec">Projekt</h2><div class="grid">
    ${F('Projektname','name',p.name,{cls:'span2'})}
    ${F('Prod.-Nr.','prodnr',p.prodnr,{cap:'characters'})}${F('Kunde','client',p.client)}
    ${F('Produktion / Agentur','production',p.production,{cls:'span2'})}
    ${F('VFX Supervisor','sup',p.sup,{cap:'words'})}${F('Regie','director',p.director,{cap:'words'})}
    ${F('DOP','dop',p.dop,{cap:'words'})}${F('Projekt-FPS','fps',p.fps,{mode:'decimal',list:'dl-fps'})}
  </div><datalist id="dl-fps">${opts(DL.fps)}</datalist></section>
  <section class="card" data-item="${p.id}"><div class="sec-row"><h2 class="sec">Szenen</h2><span class="meta mono">${(p.scenes||[]).length}</span></div>
    <p class="hint">Einmal anlegen – Fotos und Sucher-Bilder ordnest du dann per Antippen zu.</p>
    ${(p.scenes||[]).map((sc,i)=>`<div class="scn">${F('',`scenes.${i}.n`,sc.n,{ph:'Nr.',cls:'mono-in',cap:'characters'})}${F('',`scenes.${i}.name`,sc.name,{ph:'Beschreibung, z. B. Strandlauf'})}<button type="button" class="x" data-act="delScene" data-i="${i}" data-confirm aria-label="Szene löschen">×</button></div>`).join('')}
    <button class="btn block" data-act="addScene">+ Szene</button></section>
  <section class="stack"><div class="sec-row"><h2 class="sec">Tech Recce &amp; Locations</h2><span class="meta mono">${locsOf(p).length}</span></div>
    ${locsOf(p).map(locRow).join('')||empty('Noch keine Location. Für Recce und Scouting: Fotos mit Objektiv-Simulation, Sonnenstand, Check-Liste.')}
    <button class="btn block" data-act="newLoc" data-id="${p.id}">+ Location / Recce</button></section>
  <section class="stack"><div class="sec-row"><h2 class="sec">Drehtage</h2><span class="meta mono">${days.length} DT · ${nSet} Setups</span></div>
    ${days.map(dayRow).join('')||empty('Noch kein Drehtag angelegt.')}
    <button class="btn primary block" data-act="newDay" data-id="${p.id}">+ Drehtag</button></section>
  <section class="card"><h2 class="sec">Memos &amp; Claude</h2>
    <p class="hint">${memoOpen?`${memoOpen} offene Memo${memoOpen>1?'s':''}. `:''}Memos exportieren, bei Claude einfügen, Antwort hier wieder einspielen.</p>
    <button class="btn block" data-act="open" data-v="claude" data-id="${p.id}">Memos ↔ Claude</button></section>
  <section class="card" data-item="${p.id}"><h2 class="sec">Presets</h2><p class="hint">Eine Zeile pro Eintrag. Erscheinen als Vorschläge in den Kamerafeldern.</p>
    ${F('Kameras','camPresets',p.camPresets,{type:'textarea',rows:3})}
    ${F('Objektive','lensPresets',p.lensPresets,{type:'textarea',rows:4,ph:'Summicron-C 25mm\nSummicron-C 35mm\nSummicron-C 50mm'})}</section>
  <section class="card"><h2 class="sec">Export</h2>
    <div class="btns"><button class="btn" data-act="report" data-id="${p.id}">Report (PDF)</button><button class="btn" data-act="csv" data-id="${p.id}">CSV</button><button class="btn" data-act="backup" data-id="${p.id}">Backup (JSON)</button></div>
    <p class="hint ${p.lastBackup?'':'warn'}">${p.lastBackup?'Letztes Backup: '+fmtDT(p.lastBackup):'Noch kein Backup gesichert. Fotos und Daten liegen nur auf diesem iPhone.'}</p></section>
  <div class="danger"><button class="btn ghost-danger" data-act="del" data-id="${p.id}">Projekt löschen</button></div>`};
}
function dayRow(d){const n=kids(d.id,'setup').length;
  return `<button class="row" data-act="open" data-v="day" data-id="${d.id}"><span class="badge mono">DT ${esc(pad2(d.dt))}</span><div class="row-main"><strong>${esc(fmtDate(d.date))}</strong><span class="meta">${esc(d.location||'—')}</span></div><span class="count mono">${n} Setup${n===1?'':'s'}</span></button>`;}

function vDay(cur){
  const d=S.get(cur.id),p=S.get(d.parent);const ss=kids(d.id,'setup');
  return {title:`DT ${pad2(d.dt)} · ${fmtDate(d.date)}`,sub:p.name,html:`
  <section class="card" data-item="${d.id}"><div class="grid">
    ${F('Datum','date',d.date,{type:'date'})}${F('Drehtag-Nr.','dt',d.dt,{mode:'numeric'})}
    ${F('Location','location',d.location,{cls:'span2'})}</div>
    <div class="fld"><span>Wetter / Licht</span><div class="chips">${WEATHER.map(w=>chip('weather',w,(d.weather||[]).includes(w))).join('')}</div></div>
    ${F('Tagesnotiz','notes',d.notes,{type:'textarea',rows:2})}</section>
  <section class="stack"><div class="sec-row"><h2 class="sec">Setups</h2><span class="meta mono">${ss.length}</span></div>
    ${ss.map(setupRow).join('')||empty('Noch keine Setups. Neue Setups übernehmen Kameradaten und Szene vom letzten Setup.')}
    <button class="btn primary block" data-act="newSetup" data-id="${d.id}">+ Setup</button></section>
  <section class="card"><h2 class="sec">Export Drehtag</h2><div class="btns"><button class="btn" data-act="report" data-id="${d.id}">Report (PDF)</button><button class="btn" data-act="csv" data-id="${d.id}">CSV</button></div></section>
  <div class="danger"><button class="btn ghost-danger" data-act="del" data-id="${d.id}">Drehtag löschen</button></div>`};
}
function setupRow(s){const t=s.takes||[];const c=t.filter(x=>x.circled).length;const m=(s.memos||[]).filter(x=>!x.done&&x.text.trim()).length;

async function shrink(file){const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Bild nicht lesbar'));i.src=url;});
    const max=3200;const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));if(!blob)throw new Error('Konvertierung fehlgeschlagen');
    return {buf:await blob.arrayBuffer(),type:'image/jpeg'};}
  catch(e){return {buf:await file.arrayBuffer(),type:file.type||'image/jpeg'};}
  finally{URL.revokeObjectURL(url);}}

async function toggleRec(s,btn,take){
  if(rec){rec.mr.stop();return;}
  await flush();
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Audioaufnahme wird hier nicht unterstützt. Nutze die Diktiertaste.');return;}
  let stream;try{stream=await getMic();}catch(e){toast('Kein Mikrofonzugriff: '+e.message);return;}
  const type=['audio/mp4','audio/aac','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  const mr=new MediaRecorder(stream,type?{mimeType:type}:undefined);const chunks=[];const t0=Date.now();
  rec={mr,stream,btn,timer:setInterval(()=>{const b=rec&&rec.btn&&rec.btn.isConnected?rec.btn:$('#recBtn');if(b){const sec=Math.round((Date.now()-t0)/1000);b.textContent=`■ Stopp ${Math.floor(sec/60)}:${pad2(sec%60)}`;}},500)};
  btn.classList.add('rec');btn.textContent='■ Stopp 0:00';
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=async()=>{clearInterval(rec.timer);parkMic();rec=null;
    const blob=new Blob(chunks,{type:mr.mimeType||type||'audio/mp4'});if(!blob.size){toast('Aufnahme leer');rerender();return;}
    const m={id:uid(),t:nowHM(),text:'',audio:true,done:false,created:Date.now()};if(take)m.take=String(take);

    (s.memos=s.memos||[]).push(m);touch(s);await flush();rerender();toast(take?`Memo zu Take ${take} gespeichert`:'Audio-Memo gespeichert');};

const RAD=Math.PI/180;
function sunPos(date,lat,lon){const n=date.getTime()/86400000+2440587.5-2451545.0;
  const L=((280.460+0.9856474*n)%360+360)%360,g=(((357.528+0.9856003*n)%360+360)%360)*RAD;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD,eps=(23.439-0.0000004*n)*RAD;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=((18.697374558+24.06570982441908*n)%24+24)%24;const H=(gmst*15+lon)*RAD-ra;const la=lat*RAD;
  const el=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H));
  const az=Math.atan2(-Math.sin(H),Math.tan(dec)*Math.cos(la)-Math.sin(la)*Math.cos(H));
  return {az:(az/RAD+360)%360,el:el/RAD};}
function sunDay(dateStr,lat,lon){const base=new Date((dateStr||today())+'T00:00');if(isNaN(base))return null;

  for(let m=0;m<=1440;m+=2){const t=new Date(base.getTime()+m*60000);const s=sunPos(t,lat,lon);
    if(s.el>max.el)max={el:s.el,az:s.az,t};
    if(prev){[['rise',-0.833,1],['set',-0.833,0],['g1',6,1],['g2',6,0],['b1',-4,1],['b2',-4,0],['c1',-6,1],['c2',-6,0]].forEach(([k,lv,up])=>{if(!ev[k]&&cross(lv,prev.el,s.el,t,up))ev[k]={t,az:s.az};});}
    prev=s;}
  return {ev,max};}

  const d=sunDay(l.date,g.lat,g.lon);if(!d)return '';const e=d.ev;
  const now=l.time&&l.date?new Date(l.date+'T'+l.time):null;const sp=now&&!isNaN(now)?sunPos(now,g.lat,g.lon):null;
  const rows=[['Blaue Stunde',e.c1&&e.b1?`${hm(e.c1.t)}–${hm(e.b1.t)}`:'–'],['Sonnenaufgang',e.rise?`${hm(e.rise.t)} · ${deg(e.rise.az)}`:'–'],['Golden Hour',e.b1&&e.g1?`${hm(e.b1.t)}–${hm(e.g1.t)}`:'–'],
    ['Höchststand',`${hm(d.max.t)} · ${Math.round(d.max.el)}° hoch · ${deg(d.max.az)}`],['Golden Hour',e.g2&&e.b2?`${hm(e.g2.t)}–${hm(e.b2.t)}`:'–'],['Sonnenuntergang',e.set?`${hm(e.set.t)} · ${deg(e.set.az)}`:'–'],['Blaue Stunde',e.b2&&e.c2?`${hm(e.b2.t)}–${hm(e.c2.t)}`:'–']];

function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000);};i.onerror=()=>rej(new Error('Bild nicht lesbar'));i.src=u;});}
function edHTML(){return `<div id="ed" role="dialog" aria-label="Zeichnen">
  <div class="ed-top"><button class="ed-btn" data-ed="cancel">Abbrechen</button><span class="t">Zeichnen</span><button class="ed-btn pri" data-ed="save">Sichern</button></div>
  <div class="ed-stage"><canvas id="edC"></canvas></div>
  <div class="ed-bar">
    <div class="ed-row">${ED_TOOLS.map(([k,i,l])=>`<button class="ed-tool" data-tool="${k}" aria-pressed="${ed.tool===k}">${i}<small>${l}</small></button>`).join('')}</div>
    <div class="ed-row" id="edRow2"></div>
    <div class="ed-row"><button class="ed-tool" data-ed="undo">↶<small>Zurück</small></button><button class="ed-tool" data-ed="clear">⌫<small>Alles</small></button><span class="ed-hint" id="edHint"></span></div>
  </div></div>`;}
function edRow2(){const r=$('#edRow2');if(!r)return;const isMask=false;const isArea=ed.tool==='area';
  r.innerHTML=(isMask?'':ED_COLORS.map(c=>`<button class="ed-col" data-color="${c}" style="background:${c}" aria-label="Farbe" aria-pressed="${ed.color===c}"></button>`).join('')+'<span class="ed-sep"></span>')+
  ['S','M','L'].map(w=>`<button class="ed-tool" data-w="${w}" aria-pressed="${ed.w===w}">${w}<small>${isArea?'Pinsel':'Linie'}</small></button>`).join('');
  $('#edHint').textContent=isArea?'Fläche markieren – wird halbtransparent eingezeichnet':ed.tool==='text'?'Tippen, wo Text hin soll':'';}
async function edOpen(pid){const ph=photoCache.get(pid);if(!ph){toast('Foto nicht gefunden');return;}
  let img;try{img=await loadImg(new Blob([ph.buf],{type:ph.type}));}catch(e){toast(e.message);return;}
  ed={pid,ph,img,ann:clone(ph.ann||[]).concat((ph.mask||[]).map(m=>({t:'area',c:'#ff3b30',w:m.w,pts:m.pts}))),mask:[],tool:'pen',color:ED_COLORS[0],w:'M',cur:null,showMask:true};
  document.body.insertAdjacentHTML('beforeend',edHTML());edRow2();
  ed.el=$('#ed');ed.c=$('#edC');
  ed.el.addEventListener('click',edClick);
  ed.c.addEventListener('pointerdown',edDown);ed.c.addEventListener('pointermove',edMove);ed.c.addEventListener('pointerup',edUp);ed.c.addEventListener('pointercancel',edUp);
  ed.onR=()=>setTimeout(edDraw,200);window.addEventListener('resize',ed.onR);
  edDraw();}
function edClose(){if(!ed)return;window.removeEventListener('resize',ed.onR);ed.el.remove();ed=null;}
function edRect(){const c=ed.c,d=window.devicePixelRatio||1;const W=Math.round(c.parentElement.clientWidth*d),H=Math.round(c.parentElement.clientHeight*d);
  if(c.width!==W||c.height!==H){c.width=W;c.height=H;}return fitRect(ed.img.naturalWidth,ed.img.naturalHeight,W,H);}
function drawAnn(ctx,it,r){if(it.t==='area'){const o=document.createElement('canvas');o.width=ctx.canvas.width;o.height=ctx.canvas.height;drawAnn(o.getContext('2d'),Object.assign({},it,{t:'pen'}),r);ctx.save();ctx.globalAlpha=.42;ctx.drawImage(o,0,0);ctx.restore();return;}
  const X=v=>r.x+v*r.w,Y=v=>r.y+v*r.h;const lw=Math.max(1,it.w*r.w);
  ctx.save();ctx.strokeStyle=ctx.fillStyle=it.c||'#ff3b30';ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  if(it.t==='pen'||it.t==='mask'){const p=it.pts;if(!p||!p.length){ctx.restore();return;}ctx.beginPath();ctx.moveTo(X(p[0][0]),Y(p[0][1]));
    if(p.length===1)ctx.lineTo(X(p[0][0])+.01,Y(p[0][1]));for(let i=1;i<p.length;i++)ctx.lineTo(X(p[i][0]),Y(p[i][1]));ctx.stroke();}
  else if(it.t==='arrow'){const ax=X(it.a[0]),ay=Y(it.a[1]),bx=X(it.b[0]),by=Y(it.b[1]);const an=Math.atan2(by-ay,bx-ax),hl=Math.max(lw*4,10);
    ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-hl*Math.cos(an-.45),by-hl*Math.sin(an-.45));ctx.lineTo(bx-hl*Math.cos(an+.45),by-hl*Math.sin(an+.45));ctx.closePath();ctx.fill();}
  else if(it.t==='rect'){ctx.strokeRect(Math.min(X(it.a[0]),X(it.b[0])),Math.min(Y(it.a[1]),Y(it.b[1])),Math.abs(X(it.b[0])-X(it.a[0])),Math.abs(Y(it.b[1])-Y(it.a[1])));}
  else if(it.t==='ell'){ctx.beginPath();ctx.ellipse((X(it.a[0])+X(it.b[0]))/2,(Y(it.a[1])+Y(it.b[1]))/2,Math.abs(X(it.b[0])-X(it.a[0]))/2+.1,Math.abs(Y(it.b[1])-Y(it.a[1]))/2+.1,0,0,Math.PI*2);ctx.stroke();}
  else if(it.t==='text'){const fs=Math.max(10,it.size*r.w);ctx.font=`700 ${fs}px -apple-system,Helvetica,Arial,sans-serif`;ctx.textBaseline='top';
    ctx.lineWidth=Math.max(2,fs/7);ctx.strokeStyle=(it.c==='#111111')?'rgba(255,255,255,.85)':'rgba(0,0,0,.75)';String(it.s).split('\n').forEach((ln,i)=>{ctx.strokeText(ln,X(it.x),Y(it.y)+i*fs*1.15);ctx.fillText(ln,X(it.x),Y(it.y)+i*fs*1.15);});}
  ctx.restore();}
function drawMask(ctx,mask,r,W,H,alpha){if(!mask.length)return;const o=document.createElement('canvas');o.width=W;o.height=H;const oc=o.getContext('2d');
  mask.forEach(m=>drawAnn(oc,Object.assign({},m,{c:'#ff2d2d'}),r));ctx.save();ctx.globalAlpha=alpha;ctx.drawImage(o,0,0);ctx.restore();}
function edDraw(){if(!ed)return;const r=edRect();const ctx=ed.c.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,ed.c.width,ed.c.height);
  ctx.drawImage(ed.img,r.x,r.y,r.w,r.h);ed.r=r;
  ed.ann.forEach(it=>drawAnn(ctx,it,r));if(ed.cur)drawAnn(ctx,ed.cur,r);}
function edPt(e){const b=ed.c.getBoundingClientRect(),d=ed.c.width/b.width;const r=ed.r;return [Math.min(1,Math.max(0,((e.clientX-b.left)*d-r.x)/r.w)),Math.min(1,Math.max(0,((e.clientY-b.top)*d-r.y)/r.h))];}
function edDown(e){if(!ed||!e.isPrimary)return;e.preventDefault();const p=edPt(e);
  if(ed.tool==='text'){const s=window.prompt('Text');if(s&&s.trim()){ed.ann.push({t:'text',c:ed.color,size:{S:.03,M:.045,L:.07}[ed.w],x:p[0],y:p[1],s:s.trim()});edDraw();}return;}
  try{ed.c.setPointerCapture(e.pointerId);}catch{}
  if(ed.tool==='pen')ed.cur={t:'pen',c:ed.color,w:ED_W[ed.w],pts:[p]};
  else if(ed.tool==='area')ed.cur={t:'area',c:ed.color,w:ED_MW[ed.w],pts:[p]};
  else ed.cur={t:ed.tool,c:ed.color,w:ED_W[ed.w],a:p,b:p};edDraw();}
function edMove(e){if(!ed||!ed.cur)return;e.preventDefault();const p=edPt(e);if(ed.cur.pts)ed.cur.pts.push(p);else ed.cur.b=p;edDraw();}
function edUp(){if(!ed||!ed.cur)return;const c=ed.cur;ed.cur=null;
  if(c.pts){ed.ann.push(Object.assign(c,{pts:c.pts.filter((q,i)=>i%1===0).map(q=>[+q[0].toFixed(4),+q[1].toFixed(4)])}));}
  else if(Math.hypot(c.b[0]-c.a[0],c.b[1]-c.a[1])>.01)ed.ann.push(c);edDraw();}
async function edRender(withMaskOnly){const W=ed.img.naturalWidth,H=ed.img.naturalHeight;const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');const r={x:0,y:0,w:W,h:H};
  if(withMaskOnly){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ed.mask.forEach(m=>drawAnn(ctx,Object.assign({},m,{c:'#ffffff'}),r));return new Promise(res=>c.toBlob(res,'image/png'));}
  ctx.drawImage(ed.img,0,0);ed.ann.forEach(it=>drawAnn(ctx,it,r));return new Promise(res=>c.toBlob(res,'image/jpeg',.88));}
async function edSave(){const ph=ed.ph;ph.ann=ed.ann;ph.mask=[];
  if(ed.ann.length){const b=await edRender(false);ph.annBuf=b?await b.arrayBuffer():null;}else ph.annBuf=null;
  ph.thumb=await makeThumb(phBlob(ph));await idb('photos','readwrite',st=>st.put(ph));
  const x=vw.list.find(q=>q.pid===ph.id);if(x){const u=URL.createObjectURL(phBlob(ph));objURLs.push(u);x.src=u;const sl=$('#vwTrack').children[vw.list.indexOf(x)];if(sl){const im=sl.querySelector('img');if(im)im.src=u;}}
  vw.dirty=true;edClose();toast('Gespeichert – Original bleibt erhalten');}
function edClick(e){const t=e.target.closest('[data-tool],[data-color],[data-w],[data-ed]');if(!t)return;
  if(t.dataset.tool){ed.tool=t.dataset.tool;document.querySelectorAll('#ed [data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===ed.tool));edRow2();edDraw();return;}
  if(t.dataset.color){ed.color=t.dataset.color;edRow2();return;}
  if(t.dataset.w){ed.w=t.dataset.w;edRow2();return;}
  const a=t.dataset.ed;
  if(a==='cancel')edClose();else if(a==='save')edSave().catch(err=>toast('Fehler: '+err.message));
  else if(a==='undo'){ed.ann.pop();edDraw();}
  else if(a==='clear'){if(!t.dataset.armed){t.dataset.armed='1';t.classList.add('armed');setTimeout(()=>{delete t.dataset.armed;t.classList.remove('armed');},3000);return;}ed.ann=[];ed.mask=[];edDraw();delete t.dataset.armed;t.classList.remove('armed');}
}

function rSetup(s){const cams=s.cams||[];const t=s.takes||[];const refs=s.refs||{};const memos=(s.memos||[]).filter(m=>m.text.trim()&&!m.done);
  const camNotes=cams.filter(c=>c.note);
  return `<div class="r-setup"><div class="r-sh"><span class="r-id mono">${esc(s.vfxid)}</span><span>${esc([s.scene&&'Szene '+s.scene,s.slate&&'Slate '+s.slate,s.time].filter(Boolean).join(' · '))}</span></div>
  ${s.desc?`<p>${nl(s.desc)}</p>`:''}${(s.kinds||[]).length?`<p class="r-tags">${esc(s.kinds.join(' · '))}</p>`:''}
  ${cams.length?`<div class="tbl"><table><thead><tr><th>Cam</th><th>Body</th><th>Objektiv</th><th>mm</th><th>T</th><th>ISO</th><th>Shutter</th><th>FPS</th><th>Filter</th><th>K</th><th>Höhe cm</th><th>Tilt °</th><th>Fokus m</th><th>Rig</th></tr></thead><tbody>
  ${cams.map(c=>`<tr>${['cam','body','lens','mm','tstop','iso','shutter','fps','filter','kelvin','height','tilt','focus','rig'].map(f=>`<td>${esc(c[f])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:''}
  ${camNotes.map(c=>`<p><b>Cam ${esc(c.cam)}:</b> ${nl(c.note)}</p>`).join('')}
  <div class="r-refs">${REFS.map(r=>`<span class="${refs[r.k]?'on':'off'}">${refs[r.k]?'✓':'–'} ${r.l}</span>`).join('')}</div>
  ${s.refsNote?`<p>${nl(s.refsNote)}</p>`:''}
  ${t.length?`<div class="tbl"><table><thead><tr><th>Take</th><th>●</th><th>Clip / TC</th><th>Notiz</th></tr></thead><tbody>${t.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.circled?'●':''}</td><td>${esc(x.clip)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${s.notes?`<p><b>Notizen:</b> ${nl(s.notes)}</p>`:''}
  ${memos.map(m=>`<p class="r-memo">Memo ${esc(m.t)}: ${nl(m.text)}</p>`).join('')}
  <div class="r-photos" data-setup="${s.id}"></div></div>`;}
function rLoc(l){const g=parseGPS(l.gps);const d=g?sunDay(l.date,g.lat,g.lon):null;const memos=(l.memos||[]).filter(m=>m.text.trim()&&!m.done);
  const kv=[['Datum',[l.date&&fmtDate(l.date),l.time].filter(Boolean).join(' · ')],['Adresse',l.address],['Kontakt',l.contact],['GPS',l.gps],
    ['Sonne',d?`Aufgang ${hm(d.ev.rise&&d.ev.rise.t)} (${d.ev.rise?deg(d.ev.rise.az):'–'}) · Höchststand ${hm(d.max.t)} ${Math.round(d.max.el)}° · Untergang ${hm(d.ev.set&&d.ev.set.t)} (${d.ev.set?deg(d.ev.set.az):'–'}) · ${tzLabel()}`:''],
    ['Zugang',l.access],['Strom',l.power],['Ton',l.sound],['Licht',l.light],['VFX',l.vfx],['Notizen',l.notes]].filter(x=>x[1]);

  ${(l.flags||[]).length?`<p class="r-tags">${esc(l.flags.join(' · '))}</p>`:''}
  <dl class="r-meta">${kv.map(([k,v])=>`<dt>${k}</dt><dd>${nl(v)}</dd>`).join('')}</dl>
  ${memos.map(m=>`<p class="r-memo">Memo ${esc(m.t)}: ${nl(m.text)}</p>`).join('')}

async function fillReportPhotos(days,locs){for(const s of [...days.flatMap(d=>kids(d.id,'setup')),...(locs||[])]){if(!s.photoCount)continue;
  const box=document.querySelector(`.r-photos[data-setup="${s.id}"]`);if(!box)continue;
  const scs=scenesOf(s);const ord=new Map(scs.map((x,i)=>[x.id,i]));const list=(await getPhotos(s.id)).sort((a,b)=>(ord.has(a.scene)?ord.get(a.scene):999)-(ord.has(b.scene)?ord.get(b.scene):999));box.innerHTML=list.map(ph=>{const sc=scs.find(x=>x.id===ph.scene);ph=Object.assign({},ph,{caption:[sc?sceneLabel(sc):'',ph.caption].filter(Boolean).join(' · ')});const u=URL.createObjectURL(phBlob(ph));objURLs.push(u);return `<figure><img src="${u}" alt="${esc(ph.caption||'Set-Foto')}">${ph.caption?`<figcaption>${esc(ph.caption)}</figcaption>`:''}</figure>`;}).join('');}}

/* ---------- Claude round trip ---------- */
const PATCH_SETUP=/^(scene|slate|time|desc|kinds|refsNote|notes|refs\.[a-z]+|cams\.\d+\.(cam|body|lens|mm|tstop|iso|shutter|fps|filter|kelvin|height|tilt|focus|rig|note)|takes\.\d+\.(n|circled|clip|note))$/;
const PATCH_DAY=/^(date|dt|location|weather|notes)$/;
const PATCH_LOC=/^(name|kind|date|time|address|contact|gps|flags|access|power|sound|light|vfx|notes)$/;
function memoExport(p){
  const out=[];
  out.push('SETLOG-MEMOS v1','','Hallo Claude, das sind meine Set-Memos aus der App „VFX Setlog“.','Bitte arbeite die Infos aus den Memos in die passenden Felder ein und gib mir NUR einen JSON-Codeblock in diesem Format zurück:','',
  '{"app":"vfx-setlog-update","project":"<PROJEKT-ID>","setups":[{"id":"<SETUP-ID>","set":{"<feld>":"<wert>"},"appendNotes":"<Text>","memoText":{"<MEMO-ID>":"<Transkript>"},"doneMemos":["<MEMO-ID>"]}],"days":[{"id":"<DAY-ID>","set":{"location":"…"}}],"locations":[{"id":"<LOC-ID>","set":{"<feld>":"<wert>"},"appendNotes":"<Text>","memoText":{"<MEMO-ID>":"<Transkript>"},"doneMemos":["<MEMO-ID>"]}]}','',
  'Erlaubte Setup-Felder: scene, slate, time (HH:MM), desc, kinds (Array aus: '+KINDS.join(', ')+'), refsNote, notes,',
  '  refs.<key> (true/false; keys: '+REFS.map(r=>r.k+'='+r.l).join(', ')+'),',
  '  cams.<index>.<feld> (felder: cam, body, lens, mm, tstop, iso, shutter, fps, filter, kelvin, height (cm), tilt (°), focus (m), rig, note), neuer Index = neue Kamera,',
  '  takes.<index>.<feld> (n, circled true/false, clip, note), neuer Index = neuer Take.',
  'Erlaubte Drehtag-Felder: date (YYYY-MM-DD), dt, location, weather (Array), notes.',
  'Erlaubte Location-Felder: name, kind (Tech Recce|Location Scout|Director Scout), date, time, address, contact, gps ("lat, lon"), flags (Array aus: '+LOC_FLAGS.join(', ')+'), access, power, sound, light, vfx, notes.',
  'Alle Werte als String, außer refs/circled (Boolean) und kinds/weather (Array). Überschreibe keine Werte ohne Grund. Was in kein Feld passt, kommt in appendNotes. Markiere verarbeitete Memos in doneMemos.',
  'Audio-Memos: Transkribiere das Audio (Feld audio, Base64), schreibe das bereinigte Transkript in memoText des Setups/der Location, zu dem das Memo gehört.',
  'Ordne Inhalte dem richtigen Ziel zu: Ein Memo mit „zu Take N“ betrifft diesen Take; nennt das Memo andere Takes, Setups oder Szenen, trage die Infos dort ein (takes.<index>.note, circled, Kamerafelder, refs usw.). Take-Index = Position in der takes-Liste (takes.0 = erster Take).','');
  out.push(`PROJEKT-ID: ${p.id}`,`Projekt: ${p.name}${p.prodnr?' ('+p.prodnr+')':''}`,'');
  if((p.scenes||[]).length)out.push('SZENEN: '+p.scenes.filter(s=>s.n||s.name).map(s=>`${s.n}=${s.name||'–'}`).join(' | '),'');
  let n=0;
  for(const d of kids(p.id,'day')){const ss=kids(d.id,'setup').filter(s=>(s.memos||[]).some(m=>!m.done&&(m.text.trim()||m.audio)));
    if(!ss.length)continue;
    out.push(`=== DT ${pad2(d.dt)} · ${d.date} · DAY-ID: ${d.id}`,`Location: ${d.location||'–'}`);
    for(const s of ss){out.push('',`--- Setup ${s.vfxid} · SETUP-ID: ${s.id}`,`Szene: ${s.scene||'–'} | Slate: ${s.slate||'–'} | Zeit: ${s.time||'–'}`,`Beschreibung: ${s.desc||'–'}`);
      (s.cams||[]).forEach((c,i)=>out.push(`cams.${i}: `+CAM_FIELDS.filter(f=>c[f]).map(f=>`${f}=${c[f]}`).join(', ')));
      out.push('refs: '+(REFS.filter(r=>(s.refs||{})[r.k]).map(r=>r.k).join(', ')||'keine'));
      (s.takes||[]).forEach((t,i)=>out.push(`takes.${i}: n=${t.n}${t.circled?', circled':''}${t.clip?', clip='+t.clip:''}${t.note?', note='+t.note:''}`));
      for(const m of (s.memos||[]).filter(m=>!m.done&&(m.text.trim()||m.audio))){n++;out.push(`MEMO ${m.id} (${m.t}${m.take?', zu Take '+m.take:''}${m.audio?', Audio im Paket':''}): ${m.text.trim()||'[Audio – bitte transkribieren]'}`);}
    }out.push('');}
  const ls=locsOf(p).filter(l=>(l.memos||[]).some(m=>!m.done&&(m.text.trim()||m.audio)));
  if(ls.length){out.push('=== LOCATIONS / RECCE');
    for(const l of ls){out.push('',`--- Location ${l.name} · LOC-ID: ${l.id}`,`kind=${l.kind||''}, date=${l.date||''}, gps=${l.gps||''}`,'flags: '+((l.flags||[]).join(', ')||'keine'));
      ['address','contact','access','power','sound','light','vfx','notes'].forEach(k=>{if(l[k])out.push(`${k}: ${String(l[k]).replace(/\n/g,' / ')}`);});
      for(const m of l.memos.filter(m=>!m.done&&(m.text.trim()||m.audio))){n++;out.push(`MEMO ${m.id} (${m.t}${m.audio?', Audio im Paket':''}): ${m.text.trim()||'[Audio – bitte transkribieren]'}`);}}
    out.push('');}
  return {text:out.join('\n'),count:n};}
async function memoPackage(p){const ex=memoExport(p);const audio=[];

function applyPatch(p,j,dry){const log=[];const touched=new Set();

  for(const u of j.setups||[]){const s=S.get(u.id);if(!s||!own.has(u.id)){log.push(`⚠ Setup ${u.id} nicht in diesem Projekt – übersprungen`);continue;}
    const w=dry?clone(s):s;
    for(const [k,v] of Object.entries(u.set||{})){if(!PATCH_SETUP.test(k)){log.push(`⚠ ${s.vfxid}: Feld „${k}“ nicht erlaubt`);continue;}
      const m=k.match(/^(cams|takes)\.(\d+)\./);

    if(u.appendNotes&&String(u.appendNotes).trim()){w.notes=(w.notes?w.notes+'\n':'')+String(u.appendNotes).trim();log.push(`${s.vfxid}: Notiz ergänzt`);}
    for(const [mid,txt] of Object.entries(u.memoText||{})){const mm=(w.memos||[]).find(x=>x.id===mid);if(mm&&String(txt).trim()){mm.text=String(txt).trim();log.push(`${s.vfxid}: Memo ${mm.t} transkribiert`);}}
    for(const mid of u.doneMemos||[]){const mm=(w.memos||[]).find(x=>x.id===mid);if(mm){mm.done=true;log.push(`${s.vfxid}: Memo ${mm.t} als übernommen markiert`);}}
    touched.add(s);}
  for(const u of j.days||[]){const d=S.get(u.id);if(!d||!ownDays.has(u.id)){log.push(`⚠ Drehtag ${u.id} nicht in diesem Projekt – übersprungen`);continue;}
    const w=dry?clone(d):d;
    for(const [k,v] of Object.entries(u.set||{})){if(!PATCH_DAY.test(k)){log.push(`⚠ DT ${d.dt}: Feld „${k}“ nicht erlaubt`);continue;}const nv=normVal(k,v);w[k]=nv;log.push(`DT ${pad2(d.dt)}: ${k} = ${Array.isArray(nv)?nv.join(', '):nv}`);}
    touched.add(d);}
  const ownLocs=new Set(locsOf(p).map(l=>l.id));
  for(const u of j.locations||[]){const l=S.get(u.id);if(!l||!ownLocs.has(u.id)){log.push(`⚠ Location ${u.id} nicht in diesem Projekt – übersprungen`);continue;}
    const w=dry?clone(l):l;
    for(const [k,v] of Object.entries(u.set||{})){if(!PATCH_LOC.test(k)){log.push(`⚠ ${l.name}: Feld „${k}“ nicht erlaubt`);continue;}const nv=k==='flags'?(Array.isArray(v)?v.map(String):String(v).split(',').map(x=>x.trim()).filter(Boolean)):String(v??'');w[k]=nv;log.push(`${l.name}: ${k} = ${Array.isArray(nv)?nv.join(', '):nv}`);}
    if(u.appendNotes&&String(u.appendNotes).trim()){w.notes=(w.notes?w.notes+'\n':'')+String(u.appendNotes).trim();log.push(`${l.name}: Notiz ergänzt`);}
    for(const [mid,txt] of Object.entries(u.memoText||{})){const mm=(w.memos||[]).find(x=>x.id===mid);if(mm&&String(txt).trim()){mm.text=String(txt).trim();log.push(`${l.name}: Memo ${mm.t} transkribiert`);}}
    for(const mid of u.doneMemos||[]){const mm=(w.memos||[]).find(x=>x.id===mid);if(mm){mm.done=true;log.push(`${l.name}: Memo ${mm.t} als übernommen markiert`);}}
    touched.add(l);}

    case 'selMode':{photoUI.sel=photoUI.sel?null:new Set();fillPhotos(it);break;}
    case 'assignSel':{if(!photoUI.sel||!photoUI.sel.size){toast('Erst Fotos antippen');break;}const n=await setPhotoScene([...photoUI.sel],b.dataset.val);const sc=scenesOf(it).find(x=>x.id===b.dataset.val);photoUI.sel=null;await fillPhotos(it);toast(`${n} Foto${n>1?'s':''} → ${sceneLabel(sc)}`);break;}
    case 'delSel':{if(!photoUI.sel||!photoUI.sel.size)break;const ids=[...photoUI.sel];await idb('photos','readwrite',st=>{ids.forEach(i=>st.delete(i));});await deleteOrphanOrigs(it.id);photoUI.sel=null;await fillPhotos(it);toast(`${ids.length} gelöscht`);break;}
    case 'addScene':{const sc=(it.scenes=it.scenes||[]);const last=sc[sc.length-1];const nn=last&&/^\d+$/.test(last.n)?String(+last.n+1):'';sc.push({id:uid(),n:nn,name:''});touch(it);rerender();const ins=document.querySelectorAll('.scn input');const t=ins[ins.length-(nn?1:2)];if(t)t.focus();break;}
    case 'delScene':{it.scenes.splice(+b.dataset.i,1);touch(it);rerender();break;}
    case 'setKind':{it.kind=b.dataset.val;touch(it);rerender();break;}
    case 'finder':{await flush();vfOpen(S.get(b.dataset.id));break;}
    case 'lensSheet':{await flush();lensSheetOpen(S.get(b.dataset.id));break;}
    case 'gps':{if(!navigator.geolocation){toast('Standort nicht verfügbar');break;}b.textContent='◎ Suche Position…';
      navigator.geolocation.getCurrentPosition(pos=>{it.gps=pos.coords.latitude.toFixed(6)+', '+pos.coords.longitude.toFixed(6);touch(it);rerender();toast(`Position übernommen (±${Math.round(pos.coords.accuracy)} m)`);},
        err=>{b.textContent='◎ Position übernehmen';toast('Standort: '+(err.code===1?'nicht erlaubt – Einstellungen → Datenschutz → Ortungsdienste → Safari-Websites':err.message));},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});break;}
    case 'newSetup':{const s=await createSetup(S.get(b.dataset.id));go('setup',s.id);break;}
    case 'dupSetup':{const src=S.get(b.dataset.id);const s=await createSetup(S.get(src.parent),src);nav.pop();go('setup',s.id);toast('Setup dupliziert');break;}
    case 'toggle':{const k=b.dataset.k,v=b.dataset.val;const arr=(getPath(it,k)||[]).slice();const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1);setPath(it,k,arr);touch(it);b.setAttribute('aria-pressed',i<0);break;}
    case 'flag':{const on=!getPath(it,b.dataset.k);setPath(it,b.dataset.k,on);touch(it);b.setAttribute('aria-pressed',on);break;}
    case 'addTake':{const t=it.takes=it.takes||[];const n=t.length?Math.max(...t.map(x=>+x.n||0))+1:1;t.push({n:String(n),circled:false,clip:'',note:''});touch(it);rerender();break;}
    case 'circle':{const tk=it.takes[+b.dataset.i];tk.circled=!tk.circled;touch(it);rerender();break;}
    case 'delTake':{it.takes.splice(+b.dataset.i,1);touch(it);rerender();break;}
    case 'addCam':{const s=S.get(b.dataset.id);const last=s.cams[s.cams.length-1];const c=last?Object.assign(clone(last),{note:''}):blankCam('A',projectOf(s));c.cam=String.fromCharCode(65+s.cams.length);s.cams.push(c);touch(s);rerender();break;}
    case 'delCam':{it.cams.splice(+b.dataset.i,1);it.cams.forEach((c,i)=>c.cam=String.fromCharCode(65+i));touch(it);rerender();break;}
    case 'addMemo':{(it.memos=it.memos||[]).push({id:uid(),t:nowHM(),text:'',audio:false,done:false,created:Date.now()});touch(it);rerender();const ta=document.querySelectorAll('#memos textarea');const last=ta[ta.length-1];if(last){last.focus();}break;}
    case 'delMemo':{const m=it.memos.splice(+b.dataset.i,1)[0];if(m&&m.audio)await idb('audio','readwrite',s=>s.delete(m.id));touch(it);rerender();break;}
    case 'rec':await toggleRec(it,b);break;
    case 'recTake':{const tk=it.takes[+b.dataset.i];await toggleRec(it,b,tk&&tk.n);break;}
    case 'delPhoto':{await idb('photos','readwrite',s=>s.delete(b.dataset.pid));await deleteOrphanOrigs(it.id);await fillPhotos(it);break;}
    case 'del':{const x=S.get(b.dataset.id);await deleteItem(x.id);nav.pop();toast('Gelöscht');render();window.scrollTo(0,0);break;}
    case 'report':go('report',b.dataset.id);break;
    case 'print':window.print();break;
    case 'csv':{const x=S.get(b.dataset.id);await flush();deliver(fileBase(x)+'_setlog.csv',buildCSV(x),'text/csv');break;}
    case 'backup':{const p=S.get(b.dataset.id);await flush();toast('Backup wird erstellt…');const json=await buildBackup(p);
      deliver(`${slug(p.name)}_setlog_backup_${today()}.json`,json,'application/json',()=>{p.lastBackup=Date.now();touch(p);rerender();});break;}
    case 'copyMemos':{const txt=memoExport(S.get(b.dataset.id)).text;try{await navigator.clipboard.writeText(txt);toast('Kopiert – jetzt in Claude einfügen');}catch{const r=document.createRange();r.selectNodeContents($('#memoText'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Text markiert – „Kopieren“ wählen');}break;}
    case 'shareMemoPkg':{const p=S.get(b.dataset.id);await flush();toast('Paket wird erstellt…');const pk=await memoPackage(p);if(!pk.count){toast('Keine offenen Memos');break;}
      deliver(`${slug(p.name)}_memos_${today()}_setlog.txt`,pk.json,'text/plain',()=>toast(`Paket mit ${pk.count} Memos (${pk.audio} Audio) bereit – im Claude-Chat anhängen`));break;}
    case 'shareMemos':{const p=S.get(b.dataset.id);deliver(`${slug(p.name)}_memos_${today()}.txt`,memoExport(p).text,'text/plain');break;}
    case 'applyPatch':{const p=S.get(b.dataset.id);const out=$('#patchOut');
      if(b.dataset.ready&&pendingPatch){applyPatch(p,pendingPatch,false);
        if($('#delAudio')&&$('#delAudio').checked){const ids=[];[...(pendingPatch.setups||[]),...(pendingPatch.locations||[])].forEach(u=>{const it=S.get(u.id);if(!it)return;(u.doneMemos||[]).forEach(mid=>{const m=(it.memos||[]).find(x=>x.id===mid);if(m&&m.audio&&m.text.trim()){m.audio=false;ids.push(mid);touch(it);}});});
          if(ids.length)await idb('audio','readwrite',st=>{ids.forEach(i=>st.delete(i));});}
        await flush();pendingPatch=null;toast('Update übernommen');nav.pop();render();window.scrollTo(0,0);break;}
      try{const j=parsePatch($('#patchIn').value);if(j.project&&j.project!==p.id)throw new Error('Update gehört zu einem anderen Projekt.');
        const log=applyPatch(p,j,true);pendingPatch=j;
        out.innerHTML=`<pre class="box">${esc(log.join('\n')||'Keine Änderungen.')}</pre>`;b.textContent=`${log.filter(l=>!l.startsWith('⚠')).length} Änderungen übernehmen`;b.dataset.ready='1';}
      catch(err){out.innerHTML=`<p class="hint warn">${esc(err.message)}</p>`;}break;}
  }}catch(err){toast('Fehler: '+(err&&err.message||err));console.error(err);}
});
app.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.cap){saveCaption(el.dataset.cap,el.value);return;}
  if(el.id==='patchIn'){pendingPatch=null;const b=document.querySelector('[data-act="applyPatch"]');if(b){delete b.dataset.ready;b.textContent='Prüfen & übernehmen';}$('#patchOut').innerHTML='';return;}
  if(!el.dataset.k)return;const host=el.closest('[data-item]');if(!host)return;const it=S.get(host.dataset.item);if(!it)return;
  setPath(it,el.dataset.k,el.value);touch(it);
  if(it.type==='loc'&&/^(gps|date|time)$/.test(el.dataset.k)){const sb=$('#sunBox');if(sb)sb.innerHTML=sunHTML(it);}
  if((it.type==='setup'&&el.dataset.k==='vfxid')||((it.type==='project'||it.type==='loc')&&el.dataset.k==='name'))$('#ttl').textContent=el.value||'—';});
app.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.file==='photo'){const host=el.closest('[data-item]');addPhotos(S.get(host.dataset.item),[...el.files]).catch(err=>toast('Foto-Fehler: '+err.message)).finally(()=>el.value='');}
  if(el.dataset.file==='import'){importBackup(el.files[0]).finally(()=>el.value='');}});

/* ---------- Boot ---------- */
(async()=>{
  $('#sub').textContent='startet…';
  try{db=await openDB();(await idb('items','readonly',s=>s.getAll())).forEach(i=>S.set(i.id,i));}
  catch(e){$('#sub').textContent='Speicherfehler';
    app.innerHTML=`<div class="empty" style="text-align:left">Lokaler Speicher nicht verfügbar: <b>${esc(e&&e.message||e)}</b><br><br>1. App komplett schließen (vom App-Umschalter wegwischen) und neu öffnen.<br>2. Kein privater Modus. 3. Einstellungen → Safari → Erweitert → Website-Daten nicht blockieren.</div><button class="btn primary block" onclick="location.reload()">Neu laden</button>`;return;}
  render();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
